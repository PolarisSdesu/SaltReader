[package]
name = "saltreader-layout"
version = "0.1.0"
edition = "2021"

[lib]
name = "saltreader_layout"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
