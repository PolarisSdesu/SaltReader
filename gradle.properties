org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships built-in Kotlin, but it bundles Kotlin Gradle Plugin 2.2.10 while this
# project compiles with external KGP 2.3.21 (the Compose and serialization compiler
# plugins are resolved at that exact version). Keep the external KGP for now; the
# built-in Kotlin / new-DSL migration needs a Kotlin version alignment first.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Gradle configuration cache: reuses the configuration phase across builds.
# AGP 9.4 still fails to serialize ProcessNavigationXmlTask state, so this stays
# disabled until the AGP/KGP plugins support the configuration cache cleanly.
# Enable with `org.gradle.configuration-cache=true` once that is fixed upstream.
org.gradle.configuration-cache=false
