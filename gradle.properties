org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships built-in Kotlin; keep the external KGP so Compose/serialization plugins stay explicit.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Gradle configuration cache: reuses the configuration phase across builds.
# AGP 9.4 still fails to serialize ProcessNavigationXmlTask state, so this stays
# disabled until the AGP/KGP plugins support the configuration cache cleanly.
# Enable with `org.gradle.configuration-cache=true` once that is fixed upstream.
org.gradle.configuration-cache=false
