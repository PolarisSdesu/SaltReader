org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships built-in Kotlin, but it bundles Kotlin Gradle Plugin 2.2.10 while this
# project compiles with external KGP 2.3.21 (the Compose and serialization compiler
# plugins are resolved at that exact version). Keep the external KGP for now; the
# built-in Kotlin / new-DSL migration needs a Kotlin version alignment first.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Gradle configuration cache: reuses the configuration phase across builds.
# Verified with this AGP 9.4 / KGP 2.3.21 combo for assembleDebug, assembleRelease
# (R8 + lintVital + compose mapping) and testDebugUnitTest. Keep problems=warn so an
# upstream serialization regression degrades to a warning instead of failing the build;
# use `--no-configuration-cache` if a task ever misbehaves.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
