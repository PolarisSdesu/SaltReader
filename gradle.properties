org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships built-in Kotlin; keep the external KGP so Compose/serialization plugins stay explicit.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Gradle configuration cache: reuses the configuration phase across builds.
# `problems=warn` keeps the build green while any third-party plugin (AGP/KGP)
# still reports a configuration-cache problem; switch to `fail` once clean.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
