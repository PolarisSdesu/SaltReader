name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug/release APKs and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with build cache
        uses: gradle/actions/setup-gradle@v4

      # No keystore.properties is present on CI: release signing is optional, so
      # assembleRelease still runs R8/resource shrinking and produces an unsigned
      # APK, which validates the proguard rules on every PR.
      - name: Assemble debug + release and run unit tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --no-daemon --stacktrace

      # Lint is advisory for now: the rules are still being triaged, so a lint
      # finding must not block code review. Remove `continue-on-error` once clean.
      - name: Lint (advisory)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  rust:
    name: Rust native text layout (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/text-reader

      - name: Run Rust unit tests
        working-directory: native/text-reader
        run: cargo test --locked --offline || cargo test --locked
